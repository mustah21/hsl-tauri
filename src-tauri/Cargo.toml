[package]
name = "hsl-routes"
version = "0.1.0"
description = "Better HSL Router"
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.90.0"

[lib]
name = "hsl_routes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Build-time code generation for Tauri
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Serialization framework with derive macros
serde = { version = "1.0.228", features = ["derive"] }
# JSON parsing for API responses and validation
serde_json = "1.0.149"
# High-performance binary serialization for tile cache and geodata with serde support
bitcode = { version = "0.6.9", features = ["serde"] }
# Decompression for geodata files
zstd = "0.13.3"

# Core Tauri framework with custom protocol support
tauri = { version = "2.10.3", features = ["protocol-asset"] }
# Logging plugin for Tauri
tauri-plugin-log = "2.8.0"
# Logging facade used throughout the application
log = "0.4.29"

# Async HTTP client with JSON support
reqwest = { version = "0.12.28", features = ["json"] }
# Async runtime providing tokio::sync::Mutex for async-compatible locking
tokio = { version = "1", features = ["full"] }
# URL parsing and validation
url = "2.5.8"

# SHA256 hashing for cache key generation
sha2 = "0.10.9"
# Hex encoding for SHA256 hash output
hex = "0.4.3"

# Embedded database for persistent tile caching
sled = "0.34.7"

# R-tree spatial indexing for geocoding with serde support
rstar = { version = "0.12.2", features = ["serde"] }

# Local converter library for address data structures
converter = { path = "../converter" }

# Regular expressions for extracting zoom levels from tile URLs
regex = "1.12.3"
# Lazy static initialization for compiled regex patterns
once_cell = "1.21.4"

# HTTP server for browser-accessible REST API (geocoding + routes)
axum = "0.8.8"
# Tower HTTP utilities for axum middleware
tower-http = { version = "0.6.8", features = ["cors"] }

[dev-dependencies]
# Needed for axum handler unit tests (ServiceExt::oneshot)
tower = { version = "0.5.3", features = ["util"] }
# Needed for reading axum response bodies in tests
http-body-util = "0.1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
